<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About - SCTI</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<style>
/* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}
a{text-decoration:none;color:inherit;}
ul{list-style:none;}

/* ===== WIDTH HELPERS ===== */
.width-100{width:100%;}
.width-75{width:75%;}
.width-50{width:50%;}
.width-25{width:25%;}

/* ===== CONTAINER ===== */
.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
}

/* ===== TOP HEADER ===== */
.header{
    background:#f4f4f4;
    padding:6px 0;
}
.head-left,
.head-right{
    display:flex;
    align-items:center;
    justify-content:center;
}
.head-right ul{
    display:flex;
    gap:15px;
}
.head-right a{
    font-size:14px;
    color:#000;
}

/* ===== MARQUEE ===== */
.notification{
    font-size:14px;
    color:#333;
}

/* ===== LOGO & MENU ===== */
.logo img{
    max-width:200px;
    width:100%;
    height:auto;
}
.head-menu ul{
    display:flex;
    justify-content:flex-end;
    gap:25px;
}
.head-menu a{
    font-size:16px;
    font-weight:500;
}

/* ===== BANNER ===== */
.main-banner{
    width:100%;
    height:400px;
    object-fit:cover;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
    .width-25,.width-50,.width-75{
        width:100%;
    }
    .container{
        flex-direction:column;
        text-align:center;
    }
    .head-menu ul{
        flex-direction:column;
        gap:12px;
        margin-top:10px;
    }
    .main-banner{
        height:260px;
    }
}

@media(max-width:480px){
    .notification{
        font-size:12px;
    }
    .main-banner{
        height:200px;
    }
}
</style>
</head>

<body>

<!-- ===== TOP HEADER ===== -->
<div class="header width-100">
    <div class="container">
        <div class="head-left width-25"></div>

        <div class="width-50">
            <marquee class="notification">
                Examination Notification | Get Ready To Explore The Genius In You | Enrollment Open 2022-23
            </marquee>
        </div>

        <div class="head-right width-25">
            <ul>
                <li><a href="#"><i class="fa fa-comment"></i> Admission Open</a></li>
                <li><a href="#"><i class="fa fa-rss"></i> Blogs</a></li>
            </ul>
        </div>
    </div>
</div>

<!-- ===== LOGO & MENU ===== -->
<div class="container">
    <div class="logo width-25">
        <img src="scti logo.jpeg" alt="SCTI Logo">
    </div>

    <div class="head-menu width-75">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="About Us.html">About Us</a></li>
            <li><a href="Gallery.html">Gallery</a></li>
            <li><a href="Notice Board.html">Notice Board</a></li>
        </ul>
    </div>
</div>

<!-- ===== BANNER ===== -->
<img src="banner.png" class="main-banner" alt="SCTI Banner">

</body>
</html>
